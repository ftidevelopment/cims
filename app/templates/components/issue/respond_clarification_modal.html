<div
    class="modal fade"
    id="respondClarificationModal{{ clarification.id }}"
    tabindex="-1"
    role="dialog"
    aria-labelledby="respondClarificationModalLabel{{ clarification.id }}"
    aria-hidden="true"
>

    <div
        class="modal-dialog modal-dialog-centered"
        role="document"
    >

        <div class="modal-content">

            <form
                method="POST"
                action="{{ url_for(
                    'issue.respond_clarification',
                    clarification_id=clarification.id
                ) }}"
            >

                <!-- Header -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="respondClarificationModalLabel{{ clarification.id }}"
                    >

                        <i class="fas fa-reply mr-2"></i>

                        Respond to Clarification

                    </h5>

                    <button
                        type="button"
                        class="close"
                        data-dismiss="modal"
                        aria-label="Close"
                    >

                        <span aria-hidden="true">
                            &times;
                        </span>

                    </button>

                </div>


                <!-- Body -->

                <div class="modal-body">

                    <div class="form-group">

                        <label>
                            Developer Request
                        </label>

                        <div class="bg-light border rounded p-3">

                            {{ clarification.question
                               | e
                               | replace('\n', '<br>')
                               | safe }}

                        </div>

                    </div>


                    <div class="form-group mb-0">

                        <label
                            for="clarification_response_{{ clarification.id }}"
                        >

                            Your Response

                            <span class="text-danger">
                                *
                            </span>

                        </label>

                        <textarea
                            name="response"
                            id="clarification_response_{{ clarification.id }}"
                            class="form-control"
                            rows="5"
                            maxlength="5000"
                            required
                            placeholder="Please provide the requested information."
                        ></textarea>

                    </div>

                </div>


                <!-- Footer -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-dismiss="modal"
                    >

                        <i class="fas fa-times mr-1"></i>

                        Cancel

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="fas fa-paper-plane mr-1"></i>

                        Submit Response

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
