<!-- =========================================================
     ADD ATTACHMENT MODAL
========================================================== -->

<div
    class="modal fade"
    id="addAttachmentModal"
    tabindex="-1"
    aria-labelledby="addAttachmentModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <form
                method="POST"
                action="{{ url_for(
                    'issue.add_attachment',
                    issue_id=issue.id
                ) }}"
                enctype="multipart/form-data"
            >

                <!-- ==================================================
                     HEADER
                =================================================== -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="addAttachmentModalLabel"
                    >

                        <i class="bi bi-paperclip me-2"></i>

                        Add Attachment

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- ==================================================
                     BODY
                =================================================== -->

                <div class="modal-body">

                    <!-- File -->

                    <div class="mb-3">

                        <label
                            for="attachment"
                            class="form-label fw-semibold"
                        >

                            File

                            <span class="text-danger">
                                *
                            </span>

                        </label>

                        <input
                            type="file"
                            name="attachment"
                            id="attachment"
                            class="form-control"
                            required
                        >

                        <div class="form-text">

                            Maximum file size: 10 MB.

                        </div>

                    </div>


                    <!-- Description -->

                    <div class="mb-3">

                        <label
                            for="attachment_description"
                            class="form-label fw-semibold"
                        >

                            Description

                        </label>

                        <input
                            type="text"
                            name="description"
                            id="attachment_description"
                            class="form-control"
                            maxlength="500"
                            placeholder="Optional description"
                        >

                        <div class="form-text">

                            Describe what this attachment contains.

                        </div>

                    </div>

                </div>


                <!-- ==================================================
                     FOOTER
                =================================================== -->

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        data-dismiss="modal"
                    >

                        <i class="bi bi-x-lg me-1"></i>

                        Cancel

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary"
                    >

                        <i class="bi bi-upload me-1"></i>

                        Upload

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
