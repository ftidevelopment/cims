<!-- ==========================================================
     Restore Confirmation Modal
     ========================================================== -->

<div
    class="modal fade"
    id="restoreModal{{ period.id }}"
    tabindex="-1"
    role="dialog"
    aria-labelledby="restoreModalLabel{{ period.id }}"
    aria-hidden="true"
>

    <div class="modal-dialog" role="document">

        <div class="modal-content">

            <!-- ==========================================
                 Header
                 ========================================== -->

            <div class="modal-header bg-success">

                <h5
                    class="modal-title"
                    id="restoreModalLabel{{ period.id }}"
                >

                    <i class="fas fa-undo mr-2"></i>

                    Confirm Restore

                </h5>

                <button
                    type="button"
                    class="close"
                    data-dismiss="modal"
                    aria-label="Close"
                >

                    <span aria-hidden="true">
                        &times;
                    </span>

                </button>

            </div>


            <!-- ==========================================
                 Body
                 ========================================== -->

            <div class="modal-body">

                <p class="mb-2">

                    Are you sure you want to restore
                    this reporting period?

                </p>

                <strong>
                    {{ period.period_name }}
                </strong>

            </div>


            <!-- ==========================================
                 Footer
                 ========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-dismiss="modal"
                >

                    Cancel

                </button>


                <form
                    method="POST"
                    action="{{ url_for(
                        'kaizen_reporting_period.restore',
                        reporting_period_id=period.id
                    ) }}"
                    class="d-inline"
                >

                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        <i class="fas fa-undo mr-1"></i>

                        Restore

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
